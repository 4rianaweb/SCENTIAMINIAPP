<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENTIA APP — No es solo café, es una esencia diferente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            beige: {
              50: '#FBF8F3',
              100: '#F5EFE6',
              200: '#EADFD0',
              300: '#D8C7B0',
            },
            coffee: {
              600: '#6F4E37',
              700: '#543825',
              800: '#3D2719',
              900: '#2A1A10',
            },
            leaf: {
              600: '#26533D',
              700: '#1B4332',
              800: '#122E22',
            },
            magenta: {
              500: '#D81B60',
              600: '#B51763',
              700: '#8E114D',
            },
            babypink: {
              100: '#FCE8F0',
              200: '#F8C8DC',
              300: '#F2A6C6',
            }
          },
          fontFamily: {
            serif: ['Fraunces', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5EFE6;
      color: #3D2719;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-editorial {
      font-family: 'Fraunces', serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeSlideUp 0.35s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-babypink-200 selection:text-coffee-900">

  <!-- ==================== MODAL DE INICIO DE SESIÓN SIMULADO (100% AUTÓNOMO) ==================== -->
  <div id="loginModal" class="hidden fixed inset-0 z-50 bg-coffee-900/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-beige-50 border-2 border-coffee-800/15 rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl animate-fade-up relative overflow-hidden">
      <div class="absolute -top-12 -right-12 w-36 h-36 rounded-full bg-babypink-200/50 blur-xl pointer-events-none"></div>
      <div class="absolute -bottom-12 -left-12 w-36 h-36 rounded-full bg-leaf-700/15 blur-xl pointer-events-none"></div>

      <button type="button" onclick="closeLoginModal()"
        class="absolute top-4 right-4 z-10 w-8 h-8 rounded-full bg-beige-200 hover:bg-beige-300 text-coffee-900 font-bold text-xs flex items-center justify-center transition">
        ✕
      </button>

      <div class="text-center mb-5 relative">
        <span class="inline-block px-3 py-1 rounded-full bg-babypink-100 text-magenta-600 text-xs font-bold tracking-wider uppercase mb-2">
          Acceso Simulado • Demo Interactiva
        </span>
        <h1 class="font-editorial text-3xl font-bold text-coffee-900 tracking-tight">SCENTIA</h1>
        <p class="text-xs italic text-coffee-600 mt-1">"No es solo café, es una esencia diferente"</p>
      </div>

      <form id="simulatedLoginForm" class="space-y-3.5 relative">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-coffee-800 mb-1">Correo electrónico o Celular</label>
          <input type="text" id="loginEmailOrPhone" placeholder="cliente@scentia.pe o 987 654 321"
            class="w-full px-3.5 py-2.5 rounded-xl border border-beige-300 bg-white text-sm text-coffee-900 focus:outline-none focus:border-leaf-700"
            value="camila.cafe@scentia.pe" />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-coffee-800 mb-1">Contraseña (cualquiera es válida)</label>
          <input type="password" id="loginPassword" placeholder="••••••••"
            class="w-full px-3.5 py-2.5 rounded-xl border border-beige-300 bg-white text-sm text-coffee-900 focus:outline-none focus:border-leaf-700"
            value="scentia2026" />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-bold uppercase tracking-wider text-coffee-800">Tu Nickname Cafetero</label>
            <button type="button" onclick="generateRandomNickname()"
              class="text-xs font-bold text-magenta-600 hover:text-magenta-700 flex items-center gap-1 transition">
              <span>🎲</span> Cambiar divertido
            </button>
          </div>
          <input type="text" id="loginNickname" placeholder="Ej. Capitán Espresso"
            class="w-full px-3.5 py-2.5 rounded-xl border border-beige-300 bg-white text-sm text-coffee-900 font-medium focus:outline-none focus:border-leaf-700"
            value="Barista Nocturno" />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-coffee-800 mb-1">Ubicación predeterminada</label>
          <select id="loginLocation"
            class="w-full px-3.5 py-2.5 rounded-xl border border-beige-300 bg-white text-sm text-coffee-900 font-medium focus:outline-none focus:border-leaf-700">
            <option value="Casa — Av. El Bosque 412, San Isidro">🏠 Casa — Av. El Bosque 412, San Isidro</option>
            <option value="Oficina — Torre Begonias Piso 8">💼 Oficina — Torre Begonias Piso 8</option>
            <option value="Universidad — Campus Central Pabellón B">🎓 Universidad — Campus Central Pabellón B</option>
          </select>
        </div>

        <div class="pt-1 space-y-2">
          <button type="submit"
            class="w-full py-3 rounded-xl bg-leaf-700 hover:bg-leaf-800 text-white font-bold text-sm tracking-wide shadow-lg shadow-leaf-700/25 transition">
            Iniciar Sesión →
          </button>
          <button type="button" onclick="enterAsGuest()"
            class="w-full py-2.5 rounded-xl bg-beige-200/80 hover:bg-beige-200 text-coffee-900 font-bold text-xs transition">
            Entrar directo como Invitado (sin datos)
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== BARRA SUPERIOR (HEADER) ==================== -->
  <header class="sticky top-0 z-30 bg-beige-50/95 backdrop-blur-md border-b border-beige-300/70">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2.5">
      <!-- Logo -->
      <div class="flex items-center gap-2.5 cursor-pointer shrink-0" onclick="switchMainTab('home')">
        <div class="w-9 h-9 rounded-xl bg-leaf-700 text-beige-50 flex items-center justify-center font-editorial font-bold text-lg shadow-sm">
          S
        </div>
        <div>
          <span class="font-editorial font-bold text-xl tracking-tight text-coffee-900 block leading-none">SCENTIA</span>
          <span class="text-[10px] text-magenta-600 font-semibold tracking-wider uppercase hidden sm:block">Especialidad & Esencia</span>
        </div>
      </div>

      <!-- Selector rápido de ubicación -->
      <div class="flex-1 max-w-xs sm:max-w-sm">
        <button onclick="openLocationModal()"
          class="w-full flex items-center justify-between gap-2 px-3 py-1.5 rounded-full bg-white border border-beige-300 hover:border-coffee-600 text-left transition shadow-xs">
          <div class="flex items-center gap-1.5 min-w-0">
            <span class="text-magenta-600 text-sm">📍</span>
            <span id="headerLocationText" class="text-xs font-semibold text-coffee-900 truncate">Casa — Av. El Bosque 412</span>
          </div>
          <span class="text-[10px] font-bold text-leaf-700 shrink-0">Cambiar ▾</span>
        </button>
      </div>

      <!-- Navegación Desktop + Nivel + Login Simulado + Carrito -->
      <div class="flex items-center gap-2">
        <!-- Insignia de Nivel Cafetero -->
        <button
